
name: Build IPAScope IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Swift package
        run: |
          xcodebuild -resolvePackageDependencies \
            -project IPAScope.xcodeproj \
            -scheme IPAScope

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project IPAScope.xcodeproj \
            -scheme IPAScope \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/IPAScope.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry IPAScope-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IPAScope-IPA
          path: |
            IPAScope-unsigned.ipa
            build.log
          if-no-files-found: warn
          retention-days: 14
