name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          rm -rf build

          xcodebuild \
            -project MyFirstApp.xcodeproj \
            -scheme MyFirstApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        run: |
          mkdir -p build/Payload

          cp -R \
            build/DerivedData/Build/Products/Release-iphoneos/MyFirstApp.app \
            build/Payload/

          cd build
          zip -r MyFirstApp-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyFirstApp-unsigned-IPA
          path: build/MyFirstApp-unsigned.ipa